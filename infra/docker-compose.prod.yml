# Production stack (Sprint 17; docs/deployment.md).
#
# Differences from the development compose file:
# - no source mounts, no hot reload, no published database ports
# - gunicorn with uvicorn workers behind nginx, which terminates TLS
# - migrations run once at start-up, before the API accepts traffic
# - uploads and database data live on named volumes that must be backed up
name: beautyai-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-beautyai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the app network reaches it.
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    env_file: [../.env.production]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    restart: always
    env_file: [../.env.production]
    volumes:
      # Verification documents: back this up.
      - uploads:/var/lib/beautyai/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"

  # Sends what's due: reminders, receipts, aftercare (docs/notifications.md).
  notifier:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    restart: always
    env_file: [../.env.production]
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do python -m app.notifications.cli run; sleep 300; done"]
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
    restart: always
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  uploads:
