name: beautyai

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: beautyai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beautyai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beautyai}
      POSTGRES_DB: ${POSTGRES_DB:-beautyai}
    ports:
      - "5432:5432"
    volumes:
      - beautyai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beautyai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: beautyai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: beautyai_backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-beautyai}:${POSTGRES_PASSWORD:-beautyai}@postgres:5432/${POSTGRES_DB:-beautyai}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-beautyai}:${POSTGRES_PASSWORD:-beautyai}@postgres:5432/${POSTGRES_DB:-beautyai}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      # Knowledge articles (read-only), found by app/rag/ingest.py at /data/knowledge.
      - ../data/knowledge:/data/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: beautyai_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  beautyai_postgres_data:
